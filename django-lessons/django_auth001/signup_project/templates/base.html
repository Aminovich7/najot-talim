<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watches Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #222;
        }

        /* NAVBAR */
        nav {
            background: #1f1f1f;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 18px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            transition: 0.3s ease;
            font-size: 16px;
        }

        .nav-links a:hover {
            background-color: #333;
        }

        /* MAIN PAGE WRAPPER */
        .page-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }

        /* FORM CARD */
        .form-card {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        /* DJANGO FORM FIELDS */
        .form-card p {
            margin-bottom: 18px;
        }

        .form-card label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-card input,
        .form-card textarea,
        .form-card select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-card input:focus {
            outline: none;
            border-color: #222;
        }

        /* HELP TEXT */
        .helptext,
        ul {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
            margin-left: 5px;
        }

        /* BUTTON */
        .btn {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        .btn:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Watches Store</div>

        <ul class="nav-links">
            <li><a href="#">Watches List</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="{% url 'signup' %}">Sign Up</a></li>
        </ul>
    </nav>

    <div class="page-container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
