{% extends 'base.html' %}

{% block content %}

<div class="form-card" style="margin-top: 30px;">
    <h2>Mavjud Foydalanuvchilar</h2>
    {% for admin in admins %}
        <p>{{ admin.username }} — {{ admin.first_name }}</p>
    {% empty %}
        <p>Hech qanday admin topilmadi.</p>
    {% endfor %}
</div>

<div class="form-card">
    <h2>Create Account</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Sign Up</button>
    </form>
</div>

{% endblock %}
